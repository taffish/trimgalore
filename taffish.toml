[package]
name = "trimgalore"
kind = "tool"
version = "2.4.0"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/trimgalore"

[command]
name = "taf-trimgalore"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/trimgalore:2.4.0-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["fastq", "adapter-trimming", "quality-control", "sequencing", "rrbs"]
keywords = ["trim-galore", "trimgalore", "trim_galore", "FASTQ", "uBAM", "RRBS", "FastQC", "clumpify"]
description = "Trim and quality-check sequencing reads, or reorder FASTQ records without trimming. Generate offline FastQC reports from FASTQ or unaligned BAM."

[upstream]
name = "Trim Galore"
type = "github"
repo = "FelixKrueger/TrimGalore"
homepage = "https://www.trimgalore.com/"
release_url = "https://github.com/FelixKrueger/TrimGalore/releases/tag/v2.4.0"
downloads = "git+https://github.com/FelixKrueger/TrimGalore.git@508d85feae324e993e0ccbe14e9090cf2897f68d"
version = "2.4.0"
commit = "508d85feae324e993e0ccbe14e9090cf2897f68d"
license = "GPL-3.0-only"
citation = "Felix Krueger. Trim Galore. Concept DOI: 10.5281/zenodo.5127898."
doi = "10.5281/zenodo.5127898"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 240
exist = ["trim_galore", "bash", "gzip", "unzip", "ldd", "awk", "cmp", "paste", "sort", "tail"]
test = ["/usr/local/libexec/taf-trimgalore-smoke identity", "/usr/local/libexec/taf-trimgalore-smoke help", "/usr/local/libexec/taf-trimgalore-smoke single", "/usr/local/libexec/taf-trimgalore-smoke paired", "/usr/local/libexec/taf-trimgalore-smoke rrbs", "/usr/local/libexec/taf-trimgalore-smoke fastqc", "/usr/local/libexec/taf-trimgalore-smoke gzip", "/usr/local/libexec/taf-trimgalore-smoke ubam", "/usr/local/libexec/taf-trimgalore-smoke reorder", "/usr/local/libexec/taf-trimgalore-smoke library"]
