[package]
name = "trimgalore"
kind = "tool"
version = "2.3.0"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[meta]
domain = "bio"
categories = ["fastq", "adapter-trimming", "quality-control", "sequencing", "rrbs"]
keywords = ["trim-galore", "trimgalore", "trim_galore", "fastq", "adapter trimming", "quality trimming", "RRBS", "FastQC", "MultiQC", "poly-G", "poly-A", "clumpify"]
description = "Consistent quality and adapter trimming for next-generation sequencing FASTQ data, with RRBS handling and built-in FastQC-compatible reports."

[repository]
url = "https://github.com/taffish/trimgalore"

[command]
name = "taf-trimgalore"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/trimgalore:2.3.0-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[upstream]
name = "Trim Galore"
type = "github"
repo = "FelixKrueger/TrimGalore"
homepage = "https://www.trimgalore.com/"
release_url = "https://github.com/FelixKrueger/TrimGalore/releases/tag/v2.3.0"
downloads = "git+https://github.com/FelixKrueger/TrimGalore.git@v2.3.0; https://github.com/FelixKrueger/TrimGalore/archive/refs/tags/v2.3.0.tar.gz"
version = "2.3.0"
commit = "c6528e54512e0e388a392d36475291bcbf0eb0dd"
license = "GPL-3.0-only"
citation = "Krueger F. Trim Galore: consistent quality and adapter trimming for next-generation sequencing data. Babraham Institute."
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 240
exist = ["trim_galore", "bash", "gzip", "unzip", "ldd", "head", "od", "tr"]
test = ["trim_galore --version 2>&1 | grep -F 'trim_galore 2.3.0' >/dev/null && trim_galore --version 2>&1 | grep -F 'c6528e5' >/dev/null && trim_galore --help 2>&1 | grep -F 'Trim Galore: A fast, single-pass' >/dev/null && trim_galore --help 2>&1 | grep -F 'built in via the bundled fastqc-rust library' >/dev/null && trim_galore --help 2>&1 | grep -F 'output-format' >/dev/null && trim_galore --help 2>&1 | grep -F 'passthrough' >/dev/null && ! ldd /opt/trimgalore/bin/trim_galore | grep -F 'not found' >/dev/null", "mkdir -p /tmp/taf-trimgalore-single && cd /tmp/taf-trimgalore-single && printf '@r1\\nACGTACGTAGATCGGAAGAGC\\n+\\nFFFFFFFFFFFFFFFFFFFFFF\\n' > reads.fq && trim_galore --dont_gzip --length 5 -o out reads.fq >/tmp/taf-trimgalore-single.log 2>&1 && test -s out/reads_trimmed.fq && grep -F 'ACGTACGT' out/reads_trimmed.fq >/dev/null && grep -F 'Reads with adapters:' out/reads.fq_trimming_report.txt >/dev/null && grep -F '\"total_reads\": 1' out/reads.fq_trimming_report.json >/dev/null", "mkdir -p /tmp/taf-trimgalore-paired && cd /tmp/taf-trimgalore-paired && printf '@r1/1\\nACGTACGTAGATCGGAAGAGC\\n+\\nFFFFFFFFFFFFFFFFFFFFFF\\n' > r1.fq && printf '@r1/2\\nTGCATGCAAGATCGGAAGAGC\\n+\\nFFFFFFFFFFFFFFFFFFFFFF\\n' > r2.fq && trim_galore --paired --dont_gzip --length 5 -o out r1.fq r2.fq >/tmp/taf-trimgalore-paired.log 2>&1 && test -s out/r1_val_1.fq && test -s out/r2_val_2.fq && grep -F 'ACGTACGT' out/r1_val_1.fq >/dev/null && grep -F 'TGCATGCA' out/r2_val_2.fq >/dev/null && grep -F 'Pairs analyzed:' /tmp/taf-trimgalore-paired.log >/dev/null", "mkdir -p /tmp/taf-trimgalore-fastqc && cd /tmp/taf-trimgalore-fastqc && printf '@r1\\nACGTACGTAGATCGGAAGAGC\\n+\\nFFFFFFFFFFFFFFFFFFFFFF\\n' > reads.fq && trim_galore --fastqc --dont_gzip --length 5 -o out reads.fq >/tmp/taf-trimgalore-fastqc.log 2>&1 && test -s out/reads_trimmed_fastqc.html && test -s out/reads_trimmed_fastqc.zip && unzip -p out/reads_trimmed_fastqc.zip reads_trimmed_fastqc/summary.txt | grep -F 'Basic Statistics' >/dev/null", "mkdir -p /tmp/taf-trimgalore-rrbs && cd /tmp/taf-trimgalore-rrbs && printf '@r1\\nCGGACGTAGATCGGAAGAGC\\n+\\nFFFFFFFFFFFFFFFFFFFFFF\\n' > reads.fq && trim_galore --rrbs --dont_gzip --length 3 -o out reads.fq >/tmp/taf-trimgalore-rrbs.log 2>&1 && test -s out/reads_trimmed.fq && grep -F 'CGGAC' out/reads_trimmed.fq >/dev/null && grep -F 'RRBS trimmed' /tmp/taf-trimgalore-rrbs.log >/dev/null && grep -F '\"rrbs\": true' out/reads.fq_trimming_report.json >/dev/null", "mkdir -p /tmp/taf-trimgalore-clumpify && cd /tmp/taf-trimgalore-clumpify && printf '@r1\\nACGTACGTAGATCGGAAGAGC\\n+\\nFFFFFFFFFFFFFFFFFFFFFF\\n@r2\\nTGCATGCAAGATCGGAAGAGC\\n+\\nFFFFFFFFFFFFFFFFFFFFFF\\n' > reads.fq && gzip -c reads.fq > reads.fq.gz && trim_galore --clumpify --cores 2 --length 5 -o out reads.fq.gz >/tmp/taf-trimgalore-clumpify.log 2>&1 && test -s out/reads_trimmed.fq.gz && gzip -cd out/reads_trimmed.fq.gz | grep -F 'ACGTACGT' >/dev/null && grep -F 'clumpify:' /tmp/taf-trimgalore-clumpify.log >/dev/null", "mkdir -p /tmp/taf-trimgalore-ubam && cd /tmp/taf-trimgalore-ubam && printf '@r1\\nACGTACGTAGATCGGAAGAGC\\n+\\nFFFFFFFFFFFFFFFFFFFFFF\\n' > reads.fq && trim_galore --output-format ubam --length 5 -o out reads.fq >/tmp/taf-trimgalore-ubam.log 2>&1 && test -s out/reads_trimmed.bam && gzip -cd out/reads_trimmed.bam | head -c 4 | od -An -tx1 | tr -d ' \\n' | grep -Fx '42414d01' >/dev/null && grep -F '\"trim_galore_version\": \"2.3.0\"' out/reads.fq_trimming_report.json >/dev/null"]
